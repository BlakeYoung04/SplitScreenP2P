  <!-- Monitor Base Body -->
  <rect x="32" y="48" width="448" height="320" rx="24" fill="url(#bg)" stroke="#2a334d" stroke-width="8"/>
  
  <!-- Stand -->
  <path d="M220 372 L200 440 L312 440 L292 372 Z" fill="#1b2234"/>
  <rect x="160" y="440" width="192" height="16" rx="8" fill="#2a334d"/>

  <!-- 4 Quadrants -->
  <!-- Q1 Top Left -->
  <rect x="52" y="68" width="196" height="132" rx="12" fill="url(#p1)" opacity="0.85"/>
  <!-- Q2 Top Right -->
  <rect x="264" y="68" width="196" height="132" rx="12" fill="url(#p2)" opacity="0.85"/>
  <!-- Q3 Bottom Left -->
  <rect x="52" y="216" width="196" height="132" rx="12" fill="url(#p3)" opacity="0.85"/>
  <!-- Q4 Bottom Right -->
  <rect x="264" y="216" width="196" height="132" rx="12" fill="url(#p4)" opacity="0.85"/>

  <!-- Center Cross Divider -->
  <line x1="256" y1="64" x2="256" y2="352" stroke="#0e1320" stroke-width="8"/>
  <line x1="48" y1="208" x2="464" y2="208" stroke="#0e1320" stroke-width="8"/>

  <!-- Center Wi-Fi P2P Node Icon -->
  <circle cx="256" cy="208" r="32" fill="#0e1320" stroke="#00f2fe" stroke-width="4"/>
  <circle cx="256" cy="208" r="12" fill="#00f2fe"/>
